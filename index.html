<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Каталог юзернеймов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 12px;
            font-size: 13px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        /* Контактная информация */
        .contact-bar {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .contact-text {
            font-size: 13px;
            color: var(--tg-theme-text-color, #000);
        }

        .offer-btn {
            background-color: var(--tg-theme-button-color, #2a7de1);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .offer-btn:active {
            opacity: 0.8;
        }

        /* Табличный стиль */
        .username-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .username-table tr {
            border-bottom: 0.5px solid var(--tg-theme-hint-color, #c6c6c8);
        }

        .username-table td {
            padding: 10px 8px;
            vertical-align: middle;
        }

        .username-cell {
            font-weight: 500;
            word-break: break-word;
        }

        .buy-cell {
            text-align: right;
            white-space: nowrap;
        }

        .buy-link {
            background-color: var(--tg-theme-button-color, #2a7de1);
            color: var(--tg-theme-button-text-color, #ffffff);
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
            transition: opacity 0.2s;
        }

        .buy-link:active {
            opacity: 0.8;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: var(--tg-theme-hint-color, #8e8e93);
            margin-top: 20px;
            padding: 12px 0;
            border-top: 0.5px solid var(--tg-theme-hint-color, #c6c6c8);
        }

        /* Адаптация под темную тему */
        @media (prefers-color-scheme: dark) {
            .contact-bar {
                background-color: var(--tg-theme-secondary-bg-color, #1c1c1e);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Контактные данные и кнопка офферов -->
        <div class="contact-bar">
            <span class="contact-text">📩 По вопросам: t.me/AlexRocket</span>
            <a href="https://t.me/AlexRocket" class="offer-btn" target="_blank">Пример офферов →</a>
        </div>

        <!-- Таблица с юзернеймами -->
        <table class="username-table" id="usernames-table">
            <tbody>
                <!-- Данные будут загружены динамически -->
            </tbody>
        </table>

        <div class="footer">
            🔒 Покупка через Fragment.com | TON
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Список юзернеймов (без @)
        const usernamesList = [
            "AlexRocket", "RocketEdition", "Cryptogoer", "DuoBank", "MansBank",
            "JuicyLad", "oldrisk", "LuxAlexa", "hubrisk", "Addressal", "eby24x7",
            "AiPerformer", "GameGoer", "ExpoGirl", "AiCobra", "Royalharbor",
            "HunkAgent", "MuggleBank", "nuxbt", "nuxvip", "chinsup", "ultimatehit",
            "aiteem", "FlameCobra", "WoxWax", "Wholerage", "keyactor", "exteammate",
            "pool_x", "BlackTicker", "onebiv", "BtcF0under", "nesgua", "NonWizard",
            "NewsWheel", "skillflame", "UltraArmor", "exliar", "Bodyblow",
            "HazardGirls", "PokerLite", "DanbaoDianbao", "vipround", "rogatory",
            "ExtraElite", "Platinico", "Dutyfee", "Fairwords", "MapsBtc",
            "HandDevil", "BargainAgent", "vipraid", "slopeoff", "HardBargain",
            "SolarLad", "Solarmiss", "Fulldps", "layaside", "Hunkily", "UnTravels",
            "UnTravel", "RiskTravels", "Sexyrisk", "HazardLady", "DangerTrip",
            "Snootylady", "SnootyGirl", "tonfobo", "tonques", "toninventive",
            "kaifangwangluo", "TonBasic", "klingMC", "KlingMotion", "tg0ai",
            "woomtree", "Mocafe", "zhiyuanrobotics", "AgiBotcom", "ibmQiskit",
            "IbmXT", "HotAMG", "HotBMW", "HotM5G90", "HotM5F90", "HotPorsche"
        ];

        // Рендер таблицы
        function renderTable() {
            const tbody = document.querySelector('#usernames-table tbody');
            if (!tbody) return;

            tbody.innerHTML = usernamesList.map(username => `
                <tr>
                    <td class="username-cell">${username}</td>
                    <td class="buy-cell">
                        <a href="https://fragment.com/username/${username.toLowerCase()}" class="buy-link" target="_blank">
                            Купить
                        </a>
                    </td>
                </tr>
            `).join('');
        }

        renderTable();
    </script>
</body>
</html>
